; STM32F746G-DISCO: the last two sectors (2 x 256 kB, 6 and 7), read and write.
;
; The firmware of dmod-boot (the internal flash image, ~400 kB) is in the first sectors: this region starts after it.
; Make sure it stays so when the image grows - the driver cannot know what the sectors below hold.
; Erasing or programming stops the CPU while it fetches from the flash (everything that runs from it, the
; interrupts too, waits for a sector to be erased: up to a second for 256 kB).
[flash]
driver_name=dmflash
driver_order=0
base=0x08000000
layout=4x32k,1x128k,3x256k
; Sectors 6 and 7: offset 0x80000 (4x32k + 128k + 256k), 2 x 256 kB
offset=0x80000
size=0x80000
mode=rw
program_bits=32
timeout_ms=5000
