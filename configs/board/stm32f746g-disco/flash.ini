; STM32F746G-DISCO: the two firmware banks of dmod-boot's selector, read and write (one node each).
;
; Internal flash: S0 the selector, S1 its store, S2/S3 the file systems of the banks, bank A = S4 + S5 (128 + 256 kB),
; bank B = S6 + S7 (2 x 256 kB; 384 kB of it is used). Each node reaches only its own sectors: a node cannot erase the
; selector or the other bank. fwupdate writes /dev/dmflashx/bank_a, bank_b (and never the bank that runs).
; Erasing or programming stops the CPU while it fetches from the flash (everything that runs from it, the
; interrupts too, waits for a sector to be erased: up to a second for 256 kB).
[bank_a]
driver_name=dmflash
driver_order=0
base=0x08000000
layout=4x32k,1x128k,3x256k
; Sectors 4 and 5: offset 0x20000 (4 x 32k), 128 kB + 256 kB
offset=0x20000
size=0x60000
mode=rw
program_bits=32
timeout_ms=5000

[bank_b]
driver_name=dmflash
driver_order=0
base=0x08000000
layout=4x32k,1x128k,3x256k
; Sectors 6 and 7: offset 0x80000 (4 x 32k + 128k + 256k), 2 x 256 kB
offset=0x80000
size=0x80000
mode=rw
program_bits=32
timeout_ms=5000
