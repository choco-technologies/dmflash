; ESP32-S3 2.8" display board (dmod-boot, ESP32-S3FN16R8, 16 MB flash): /ext, 9 MB at 0x700000 (the layout of the flash is
; configs/board/esp32s3-lcd28/board.cmake of dmod-boot), the node /dev/dmflashx/ext. The selector, its store and the banks of
; the firmware are not reachable through it.
; Erasing or programming stops the interrupts for the time of the work (a sector: some tens of milliseconds): the firmware
; does it from the internal RAM with the caches off (see src/port/esp32s3/port.c).
[ext]
driver_name=dmflash
driver_order=0
base=0x3C000000
layout=7x1m,2304x4k
; The sectors from the 7 MB on
offset=0x700000
size=0x900000
mode=rw
program_bits=32
timeout_ms=5000
