; Elecrow DIS08070H (CrowPanel ESP32 HMI 7.0", ESP32-S3-WROOM-1-N4R8, 4 MB flash): /ext, 1.875 MB at 0x220000 (the layout of the flash is
; configs/board/elecrow-dis08070h/board.cmake of dmod-boot: the selector, its store, two banks of 960 kB), the node /dev/dmflashx/ext. The
; selector, its store and the banks of the firmware are not reachable through it.
; Erasing or programming stops the interrupts for the time of the work (a sector: some tens of milliseconds): the firmware
; does it from the internal RAM with the caches off (see src/port/esp32s3/port.c).
[ext]
driver_name=dmflash
driver_order=0
base=0x3C000000
; The chip: 2 MB in 1 MB items (nothing in them is used), the 4 kB sectors of the 2 MB that follow. The region starts at the 32nd of them.
layout=2x1m,512x4k
; The sectors from 0x220000 on, up to the end of the chip
offset=0x220000
size=0x1E0000
mode=rw
program_bits=32
timeout_ms=5000
