; STM32F4-DISCOVERY (STM32F407VG): the last four sectors (4 x 128 kB), read and write.
;
; The firmware of dmod-boot is in the first sectors: this region starts after the first 512 kB. Make sure it stays so
; when the image grows - the driver cannot know what the sectors below hold.
; Erasing or programming stops the CPU while it fetches from the flash (everything that runs from it, the
; interrupts too, waits for a sector to be erased).
[flash]
driver_name=dmflash
driver_order=0
base=0x08000000
layout=4x16k,1x64k,7x128k
; Sectors 8 to 11: offset 0x80000 (4x16k + 64k + 3x128k), 4 x 128 kB
offset=0x80000
size=0x80000
mode=rw
program_bits=32
timeout_ms=5000
