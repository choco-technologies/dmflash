; STM32F746NG (1 MB flash, one bank): the whole flash, read only. For a part with a region you may write to, see
; configs/board/<board>/flash.ini. Select this file OR the board equivalent, never both.
; Sectors (RM0385): 4 x 32 kB, 1 x 128 kB, 3 x 256 kB. The flash is read at 0x08000000 (AXI).
[flash]
driver_name=dmflash
driver_order=0
base=0x08000000
layout=4x32k,1x128k,3x256k
mode=ro
; Width of one programming step: 32 bits at a supply of 2.7-3.6 V (16 at 2.1-2.7 V, 8 at 1.8-2.1 V)
program_bits=32
timeout_ms=5000
