; ESP32-S3 with a 16 MB flash (ESP32-S3FN16R8): the whole flash, read only. For a region you may write to, see
; configs/board/<board>/flash.ini. Select this file OR the board equivalent, never both.
; The flash is read in the memory window of the data bus at 0x3C000000 (mapped by the selector of dmod-boot). The chip erases
; 4 kB sectors (4096 of them: the table takes 32 kB of the heap while the node is open).
[flash]
driver_name=dmflash
driver_order=0
base=0x3C000000
layout=4096x4k
mode=ro
program_bits=32
timeout_ms=5000
